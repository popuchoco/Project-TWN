[package]
name = "project-twn"
version = "0.1.0"
edition = "2021"
description = "以 Rust 打造的臺灣選戰策略遊戲，包含總統與地方選舉情境、候選人與幕僚模式。"
license = "GPL-3.0-only"

[lib]
name = "project_twn"
path = "src/lib.rs"

[[bin]]
name = "project-twn"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
