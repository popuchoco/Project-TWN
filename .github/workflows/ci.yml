name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC checks
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Smoke-test batch summary and TSV export
        run: |
          cargo run -- --batch 2 --year 2024 --role challenger --seed 77 --sweep-styles --batch-log target/ci-batch-runs.tsv
          $rows = @(Get-Content target/ci-batch-runs.tsv)
          if ($rows.Count -ne 9) { throw "Expected a header and 8 style/seed rows; got $($rows.Count)." }
          foreach ($row in $rows) {
            if ($row.Split("`t").Count -ne 21) { throw "Unexpected batch TSV column count." }
          }
