name: Rust CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows MSVC checks
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --all-targets

      - name: Smoke-test batch summary and TSV export
        run: |
          cargo run -- --batch 2 --year 2024 --role challenger --seed 77 --sweep-styles --batch-log target/ci-batch-runs.tsv
          $rows = @(Get-Content target/ci-batch-runs.tsv)
          if ($rows.Count -ne 9) { throw "Expected a header and 8 style/seed rows; got $($rows.Count)." }
          foreach ($row in $rows) {
            if ($row.Split("`t").Count -ne 45) { throw "Unexpected batch TSV column count." }
          }

      - name: Smoke-test paired parameter sensitivity
        run: |
          cargo run -- --batch 2 --year 2026 --region 臺北市 --role challenger --seed 77 --sensitivity --batch-log target/ci-sensitivity-runs.tsv
          $rows = @(Get-Content target/ci-sensitivity-runs.tsv)
          if ($rows.Count -ne 31) { throw "Expected a header and 30 one-factor rows; got $($rows.Count)." }
          foreach ($row in $rows) {
            if ($row.Split("`t").Count -ne 45) { throw "Unexpected sensitivity TSV column count." }
          }

      - name: Smoke-test paired parameter interaction sensitivity
        run: |
          cargo run -- --batch 1 --year 2026 --region 臺北市 --role challenger --seed 77 --interaction-sensitivity --batch-log target/ci-interaction-runs.tsv
          $rows = @(Get-Content target/ci-interaction-runs.tsv)
          if ($rows.Count -ne 85) { throw "Expected a header and 84 two-factor corner rows; got $($rows.Count)." }
          foreach ($row in $rows) {
            if ($row.Split("`t").Count -ne 45) { throw "Unexpected interaction TSV column count." }
          }

      - name: Smoke-test strategy profile comparison
        run: |
          cargo run -- --batch 1 --year 2024 --role challenger --seed 77 --sweep-strategies --batch-log target/ci-strategy-runs.tsv
          $rows = @(Get-Content target/ci-strategy-runs.tsv)
          if ($rows.Count -ne 8) { throw "Expected a header and 7 strategy rows; got $($rows.Count)." }
          foreach ($row in $rows) {
            if ($row.Split("`t").Count -ne 45) { throw "Unexpected strategy TSV column count." }
          }
          $headers = $rows[0].Split("`t")
          $positiveIndex = [Array]::IndexOf($headers, "positive_actions")
          $neutralIndex = [Array]::IndexOf($headers, "neutral_actions")
          $negativeIndex = [Array]::IndexOf($headers, "negative_actions")
          $compositionIndex = [Array]::IndexOf($headers, "action_composition")
          if ($positiveIndex -lt 0 -or $neutralIndex -lt 0 -or $negativeIndex -lt 0 -or $compositionIndex -lt 0) { throw "Strategy TSV omitted action composition." }
          $moduleColumns = @($headers | Where-Object { $_ -like "module_*_mean" })
          if ($moduleColumns.Count -ne 8) { throw "Expected eight strategy contribution columns; got $($moduleColumns.Count)." }
          foreach ($row in $rows | Select-Object -Skip 1) {
            $values = $row.Split("`t")
            $actionTotal = [int]$values[$positiveIndex] + [int]$values[$neutralIndex] + [int]$values[$negativeIndex]
            if ($actionTotal -ne 84) { throw "Action composition should account for all 84 campaign days." }
            $detailedTotal = 0
            foreach ($entry in $values[$compositionIndex].Split(";")) {
              $entryParts = $entry.Split("=")
              $detailedTotal += [int]$entryParts[1]
            }
            if ($detailedTotal -ne 84) { throw "Per-action composition should account for all 84 campaign days." }
          }
          $strategies = @($rows | Select-Object -Skip 1 | ForEach-Object { $_.Split("`t")[5] } | Sort-Object -Unique)
          if ($strategies.Count -ne 7) { throw "Expected seven distinct strategy profiles; got $($strategies.Count)." }
          @("1", "d 1", "1", "4", "1", "6", "b", "q", "y") | cargo run -- --year 2024 --role challenger --strategy issue --seed 77 | Out-File -Encoding utf8 target/ci-strategy-advice.txt
          $advice = Get-Content target/ci-strategy-advice.txt -Raw
          if (-not $advice.Contains("策略分")) { throw "Interactive action list omitted strategy ranking." }
          if (-not $advice.Contains("實際變化")) { throw "Action outcome omitted realized support change." }
          if (-not $advice.Contains("正面選戰")) { throw "Interactive action list omitted positive tactics." }
          if (-not $advice.Contains("中立選戰")) { throw "Interactive action list omitted neutral tactics." }
          if (-not $advice.Contains("負面／高風險選戰")) { throw "Interactive action list omitted negative tactics." }
          if (-not $advice.Contains("預估揭露")) { throw "Interactive action list omitted exposure forecasts." }
          if (-not $advice.Contains("本場玩家身分") -or -not $advice.Contains("玩家操控：侯友宜 / 趙少康")) { throw "Opening screen omitted the assigned player candidate." }
          if (-not $advice.Contains("其他競爭者：") -or -not $advice.Contains("柯文哲 / 吳欣盈")) { throw "Opening screen omitted the opponent roster." }
          if (-not $advice.Contains("政府施政滿意度情境值") -or -not $advice.Contains("最受關注議題")) { throw "Opening screen did not show the separate government and issue indicators." }
          if (-not $advice.Contains("候選人選舉支持度") -or -not $advice.Contains("若比較「侯友宜 / 趙少康")) { throw "Poll table did not label candidate polling or pairwise comparison clearly." }
          if ($advice.Contains("分眾支持度（原型權重")) { throw "Opening snapshot should keep voter-segment detail behind the poll lookup." }
          if (-not $advice.Contains("行動詳情｜") -or -not $advice.Contains("推薦理由：")) { throw "Interactive action details omitted explanations." }
          if (-not $advice.Contains("結束本場並立即結算？")) { throw "Early exit did not ask for confirmation." }

      - name: Smoke-test contextual help, poll lookup, and safe exit
        run: |
          @("?", "p", "1", "d 1", "1", "q", "n", "r", "q", "y") | cargo run -- --year 2024 --role challenger --seed 78 | Out-File -Encoding utf8 target/ci-interaction.txt
          $interaction = Get-Content target/ci-interaction.txt -Raw
          if (-not $interaction.Contains("行動方式：")) { throw "Interactive help did not explain the controls." }
          if ([regex]::Matches($interaction, "候選人選舉支持度").Count -lt 2) { throw "Poll lookup should be available during action selection." }
          if (-not $interaction.Contains("政府施政滿意度｜整體") -or -not $interaction.Contains("議題評價")) { throw "Poll lookup omitted the separate government opinion indicators." }
          if (-not $interaction.Contains("分眾支持度（原型權重")) { throw "Poll lookup omitted the detailed voter-segment panel." }
          if ([regex]::Matches($interaction, "✓ 第 ").Count -ne 2) { throw "Declining the exit prompt should return to the campaign." }

      - name: Smoke-test campaign setup and date mapping
        run: |
          cargo run -- --batch 1 --year 2004 --role challenger --difficulty hard --event-pack democracy --timeline date --seed 1 --batch-log target/ci-config.tsv
          $rows = @(Get-Content target/ci-config.tsv)
          $headers = $rows[0].Split("`t")
          $values = $rows[1].Split("`t")
          if ($rows.Count -ne 2 -or $values.Count -ne 45) { throw "Campaign setup smoke test has unexpected output shape." }
          if ($values[[Array]::IndexOf($headers, "difficulty")] -ne "hard") { throw "Difficulty was not recorded." }
          if ($values[[Array]::IndexOf($headers, "event_pack")] -ne "democracy") { throw "Event pack was not recorded." }
          if ($values[[Array]::IndexOf($headers, "timeline")] -ne "date") { throw "Timeline was not recorded." }

      - name: Smoke-test story path and campaign TSV
        run: |
          cargo run -- --year 2024 --role challenger --auto --seed 7 --log target/ci-story.tsv | Out-File -Encoding utf8 target/ci-story-output.txt
          $rows = @(Get-Content target/ci-story.tsv)
          if ($rows.Count -ne 2) { throw "Expected one campaign record and one header." }
          $headers = $rows[0].Split("`t")
          $values = $rows[1].Split("`t")
          if ($values.Count -ne 23) { throw "Unexpected campaign TSV column count." }
          $storyIndex = [Array]::IndexOf($headers, "story_path")
          if ($storyIndex -lt 0 -or $values[$storyIndex] -notmatch ".+>.+>.+>.+>.+>.+") { throw "Campaign log omitted the resolved six-beat story path." }
          $output = Get-Content target/ci-story-output.txt -Raw
          if (-not $output.Contains("雨後一條路")) { throw "Automatic play omitted the story arc." }
          if (-not $output.Contains("一句話之後")) { throw "Automatic play omitted the media-context story arc." }
          if (-not $output.Contains("遊戲模式：候選人模式")) { throw "Opening screen did not name candidate mode." }
          if ([regex]::Matches($output, "【候選人行程｜").Count -ne 84) { throw "Candidate mode should show the full daily campaign story." }
          if ([regex]::Matches($output, "候選人劇情：").Count -ne 84) { throw "Candidate actions should advance their story." }
          if ([regex]::Matches($output, "【多週情境｜第 ").Count -ne 6) { throw "Candidate mode should resolve all six branching story beats." }
          if ([regex]::Matches($output, "劇情回聲：").Count -ne 6) { throw "Candidate story choices should echo into later campaign weeks." }
          if (-not $output.Contains("候選人劇情回顧")) { throw "Candidate story route omitted its ending recap." }
          if (-not $output.Contains("對手回應（遊戲模型）")) { throw "Candidate mode omitted the rival's modeled response." }

      - name: Smoke-test staffer mode and daily story scenes
        run: |
          cargo run -- --year 2024 --role challenger --staffer --auto --seed 909 --log target/ci-staffer.tsv | Out-File -Encoding utf8 target/ci-staffer-output.txt
          $rows = @(Get-Content target/ci-staffer.tsv)
          if ($rows.Count -ne 2) { throw "Expected one staffer campaign record and one header." }
          $headers = $rows[0].Split("`t")
          $values = $rows[1].Split("`t")
          if ($values.Count -ne 23) { throw "Unexpected staffer campaign TSV column count." }
          $routeIndex = [Array]::IndexOf($headers, "staffer_path")
          if ($routeIndex -lt 0 -or $values[$routeIndex].Split(">").Count -ne 7) { throw "Staffer log omitted the focus and six briefing decisions." }
          $output = Get-Content target/ci-staffer-output.txt -Raw
          if ([regex]::Matches($output, "今日選戰").Count -ne 84) { throw "Staffer mode should narrate all 84 daily campaign scenes." }
          if ([regex]::Matches($output, "劇情推進：").Count -ne 84) { throw "Each daily action should advance the staffer campaign story." }
          if ([regex]::Matches($output, "【幕僚會議｜第 ").Count -ne 6) { throw "Staffer mode should resolve six strategic briefings." }
          if (-not $output.Contains("對手回應（遊戲模型）")) { throw "Staffer mode omitted the rival's modeled response." }
          if (-not $output.Contains("候選人支持度檢視（遊戲模型值，非實際民調）")) { throw "Staffer poll briefing omitted its model-only label." }
          if (-not $output.Contains("幕僚模式回顧")) { throw "Staffer campaign omitted its closing recap." }

      - name: Smoke-test fictional recall campaigns
        run: |
          cargo run -- --recall --recall-side initiator --recall-template low-turnout --auto --seed 501 | Out-File -Encoding utf8 target/ci-recall-initiator.txt
          cargo run -- --recall --recall-side opposition --recall-template high-mobilization --auto --seed 502 | Out-File -Encoding utf8 target/ci-recall-opposition.txt
          $initiator = Get-Content target/ci-recall-initiator.txt -Raw
          $opposition = Get-Content target/ci-recall-opposition.txt -Raw
          foreach ($output in @($initiator, $opposition)) {
            if (-not $output.Contains("所有人物、選區與盤勢均為虛構情境")) { throw "Recall campaign did not identify its fictional scenario." }
            if (-not $output.Contains("虛構罷免目標：區域立法委員") -or -not $output.Contains("虛構選區：")) { throw "Recall campaign did not identify its fictional target and district." }
            if (-not $output.Contains("提議") -or -not $output.Contains("有效連署") -or -not $output.Contains("罷免程序結算")) { throw "Recall campaign omitted a procedural phase or final resolution." }
          }
          if (-not $initiator.Contains("罷免提議／連署方") -or -not $opposition.Contains("反對罷免方")) { throw "Recall campaign did not identify the selected player side." }
          if (-not $initiator.Contains("兩項投票門檻") -and -not $initiator.Contains("罷免未通過")) { throw "Recall campaign did not present its threshold-based result." }
